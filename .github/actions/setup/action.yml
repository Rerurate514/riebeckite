name: Setup Node and pnpm
description: Install the locked workspace dependencies with the shared pnpm store cache.
inputs:
  node-version:
    required: false
    default: "24"
  pnpm-version:
    required: false
    default: "11.5.3"
  browsers:
    description: Comma-separated Puppeteer browsers to cache and install into the shared browser cache.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - shell: bash
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"
      run: pnpm install --frozen-lockfile
    - if: inputs.browsers != ''
      id: puppeteer
      shell: bash
      env:
        RIEBECKITE_PUPPETEER_BROWSERS: ${{ inputs.browsers }}
      run: |
        cache_dir="$(node scripts/ci/puppeteer_browsers.mjs cache-dir)"
        echo "cache-dir=$cache_dir" >> "$GITHUB_OUTPUT"
        echo "cache-key=$(node scripts/ci/puppeteer_browsers.mjs cache-key)" >> "$GITHUB_OUTPUT"
        echo "PUPPETEER_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
    - if: inputs.browsers != ''
      uses: actions/cache@v4
      with:
        path: ${{ steps.puppeteer.outputs.cache-dir }}
        key: ${{ steps.puppeteer.outputs.cache-key }}
    - if: inputs.browsers != ''
      shell: bash
      env:
        RIEBECKITE_PUPPETEER_BROWSERS: ${{ inputs.browsers }}
      run: node scripts/ci/puppeteer_browsers.mjs ensure
