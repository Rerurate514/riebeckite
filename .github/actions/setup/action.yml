name: Setup Node and pnpm
description: Install the locked workspace dependencies with the shared pnpm store cache.
inputs:
  node-version:
    required: false
    default: "24"
  pnpm-version:
    required: false
    default: "11.5.3"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
