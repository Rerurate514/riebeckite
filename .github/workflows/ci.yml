name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 11.5.3

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pluginDx: ${{ steps.select.outputs.pluginDx }}
      scaffold: ${{ steps.select.outputs.scaffold }}
      browser: ${{ steps.select.outputs.browser }}
      external: ${{ steps.select.outputs.external }}
      fastPath: ${{ steps.select.outputs.fastPath }}
      fingerprint: ${{ steps.select.outputs.fingerprint }}
      presetFastPath: ${{ steps.select.outputs.presetFastPath }}
      productionAssets: ${{ steps.select.outputs.productionAssets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: select
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" "$GITHUB_SHA" | paste -sd, -)"
            node scripts/ci/select_checks.mjs --files "$files" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/select_checks.mjs >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm check
      - run: pnpm check:docs
      - run: pnpm test:docs
      - run: pnpm check:changes
      - run: pnpm test:changelog
      - run: pnpm test:artifacts
      - run: pnpm check:packages
      - run: pnpm check:core-api
      - run: pnpm check:dependencies
      - run: pnpm check:cycles
      - run: pnpm check:double-cast
      - run: pnpm check:source-health
      - run: pnpm check:templates
      - run: pnpm check:ci-selection
      - run: pnpm check:ci-browsers
      - run: pnpm check:ci-build-artifact
      - run: pnpm test:security
      - run: pnpm check:build-packages

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/**/dist
            .riebeckite/package-build-state.json
          key: package-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build_package.mjs', 'scripts/build_packages.mjs', 'scripts/package_metadata.mjs') }}
      - run: pnpm build:packages
      - run: pnpm check:artifacts
      - run: pnpm ci:build-artifact write
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-dist-${{ github.sha }}
          path: |
            packages/**/dist
            .ci-build-metadata.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  typecheck:
    name: typecheck
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-dist-${{ github.sha }}
          path: .
      - run: pnpm ci:build-artifact verify
      - run: pnpm typecheck

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          browsers: chrome,chrome-headless-shell
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-dist-${{ github.sha }}
          path: .
      - run: pnpm ci:build-artifact verify
      - run: pnpm -r --workspace-concurrency=1 test
      - run: pnpm --filter @riebeckite/plugin-navigation test:browser
      - run: pnpm --filter @riebeckite/plugin-toc test:browser:required
      - run: pnpm --filter @riebeckite/cli test:integration

  cross-platform:
    name: cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          browsers: chrome,chrome-headless-shell
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/**/dist
            .riebeckite/package-build-state.json
          key: package-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build_package.mjs', 'scripts/build_packages.mjs', 'scripts/package_metadata.mjs') }}
      - run: pnpm build:packages
      - run: pnpm --filter @riebeckite/core test
      - run: pnpm --filter @riebeckite/honox exec node --max-old-space-size=4096 --import tsx --test --test-concurrency=1 "test/*.test.ts"

  integration-e2e:
    name: integration-e2e
    needs: [changes, build]
    if: needs.changes.outputs.external == 'true' || needs.changes.outputs.fastPath == 'true' || needs.changes.outputs.fingerprint == 'true' || needs.changes.outputs.presetFastPath == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          browsers: chrome-headless-shell
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-dist-${{ github.sha }}
          path: .
      - run: pnpm ci:build-artifact verify
      - if: needs.changes.outputs.external == 'true'
        run: pnpm test:e2e:external
      - if: needs.changes.outputs.fastPath == 'true'
        run: pnpm test:e2e:fast-path
      - if: needs.changes.outputs.fingerprint == 'true'
        run: pnpm test:e2e:fingerprint
      - if: needs.changes.outputs.presetFastPath == 'true'
        run: pnpm test:e2e:preset-fast-path

  plugin-dx:
    name: plugin-dx
    needs: [changes, build]
    if: needs.changes.outputs.pluginDx == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-dist-${{ github.sha }}
          path: .
      - run: pnpm ci:build-artifact verify
      - run: pnpm --dir tests/plugin-dx install --frozen-lockfile
      - run: pnpm --dir tests/plugin-dx run build
      - run: pnpm test:plugin-dx
      - run: pnpm test:plugin-dx:external

  scaffold:
    name: scaffold
    needs: [changes, build]
    if: needs.changes.outputs.scaffold == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-dist-${{ github.sha }}
          path: .
      - run: pnpm ci:build-artifact verify
      - run: pnpm check:scaffold

  browser:
    name: browser
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          browsers: chrome,chrome-headless-shell
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/**/dist
            .riebeckite/package-build-state.json
          key: package-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build_package.mjs', 'scripts/build_packages.mjs', 'scripts/package_metadata.mjs') }}
      - run: pnpm build:packages
      - run: pnpm test:browser
      - run: pnpm test:plugin-dev:browser

  production-assets:
    name: production-assets
    needs: [changes, build]
    if: needs.changes.outputs.productionAssets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          browsers: chrome-headless-shell
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-dist-${{ github.sha }}
          path: .
      - run: pnpm ci:build-artifact verify
      - run: pnpm --filter @riebeckite/web build
      - run: node scripts/check_production_asset_integrity.mjs website
