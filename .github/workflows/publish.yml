name: Publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even when the plan reports no changes
        type: boolean
        default: false

concurrency:
  group: riebeckite-publish
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.5.3

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          browsers: chrome-headless-shell

      - name: Build the packages
        run: pnpm build:packages

      - name: Restore publication history
        uses: actions/cache@v4
        with:
          path: apps/web/.riebeckite/publication/history.json
          key: publication-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            publication-${{ github.ref_name }}-

      - name: Plan publication
        id: plan
        run: |
          plan_file="$RUNNER_TEMP/publication-plan.json"
          pnpm --filter @riebeckite/web exec riebeckite publish plan --json > "$plan_file"
          node -e '
            const plan = require(process.env.RUNNER_TEMP + "/publication-plan.json");
            console.log(`build=${plan.plan.build}`);
            console.log(`deploy=${plan.plan.deploy}`);
            console.log(`fingerprint=${plan.plan.publicationFingerprint}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Upload the publication plan
        uses: actions/upload-artifact@v4
        with:
          name: publication-plan
          path: ${{ runner.temp }}/publication-plan.json
          if-no-files-found: error

      - name: Build the documentation site
        if: steps.plan.outputs.build == 'true' || inputs.force
        run: pnpm --filter @riebeckite/web build

      - name: Validate the built artifact
        if: steps.plan.outputs.deploy == 'true' || inputs.force
        run: pnpm --filter @riebeckite/web exec riebeckite publish validate

      - name: Deploy the built assets
        if: steps.plan.outputs.deploy == 'true' || inputs.force
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy

      - name: Record the successful deployment
        if: steps.plan.outputs.deploy == 'true' || inputs.force
        run: >
          pnpm --filter @riebeckite/web exec riebeckite publish record
          --provider cloudflare-workers --trigger ci --json
          > "$RUNNER_TEMP/publication-record.json"

      - name: Capture publication status
        if: steps.plan.outputs.deploy == 'true' || inputs.force
        run: |
          pnpm --filter @riebeckite/web exec riebeckite publish status --json > "$RUNNER_TEMP/publication-status.json"

      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-diagnostics
          path: |
            ${{ runner.temp }}/publication-plan.json
            ${{ runner.temp }}/publication-status.json
            ${{ runner.temp }}/publication-record.json
          if-no-files-found: ignore
