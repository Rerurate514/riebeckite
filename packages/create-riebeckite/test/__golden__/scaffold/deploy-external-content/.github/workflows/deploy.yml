name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

concurrency:
  group: riebeckite-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the site repository
        uses: actions/checkout@v4

      - name: Check out the external content repository
        uses: actions/checkout@v4
        with:
          repository: octo-org/notes
          token: ${{ secrets.RIEBECKITE_CONTENT_READ_TOKEN || github.token }}
          path: content

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Riebeckite build state
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            .riebeckite/cache
            .riebeckite/build/content-state.json
            .riebeckite/ssg-output-cache.json
            .riebeckite/ssg-output-cache.entries
            .riebeckite/ssg-output-cache.fast-path.json
          key: riebeckite-build-v2-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('riebeckite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            riebeckite-build-v2-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('riebeckite.config.ts') }}-
            riebeckite-build-v2-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-

      - name: Report restored Riebeckite cache
        shell: bash
        run: |
          if [ -d .riebeckite ]; then
            echo "Restored Riebeckite cache: $(du -sb .riebeckite | cut -f1) bytes"
          else
            echo "Restored Riebeckite cache: 0 bytes (cold build)"
          fi

      - name: Validate configuration and plugins
        run: npm exec riebeckite check

      - name: Build the site
        run: npm exec riebeckite build

      - name: Report Riebeckite cache to save
        shell: bash
        run: |
          echo "Riebeckite cache to save: $(du -sb .riebeckite | cut -f1) bytes"

      - name: Publication gate
        run: npm exec riebeckite publish gate --provider cloudflare-workers

      - name: Deploy the built assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
