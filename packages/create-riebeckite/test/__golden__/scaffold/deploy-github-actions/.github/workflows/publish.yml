name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

concurrency:
  group: riebeckite-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PUBLICATION_STATE_BRANCH: publication-state

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the site repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify latest revision
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "This run is for an older revision; stop so the current branch head can publish."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore publication state
        id: publication-state
        shell: bash
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/publication-state/state.json"
          echo "RIEBECKITE_PUBLICATION_STATE=$state_file" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$state_file")"
          branch_status=0
          git ls-remote --exit-code --heads origin "$PUBLICATION_STATE_BRANCH" > /dev/null 2>&1 || branch_status=$?
          if [ "$branch_status" -eq 0 ]; then
            git fetch --depth=1 origin "$PUBLICATION_STATE_BRANCH"
            sha="$(git rev-parse FETCH_HEAD)"
            if ! git cat-file -e "$sha:state.json" 2>/dev/null; then
              echo "::error::The $PUBLICATION_STATE_BRANCH branch exists but has no state.json. Restore or delete the branch before publishing."
              exit 1
            fi
            git show "$sha:state.json" > "$state_file"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "Restored publication state from $PUBLICATION_STATE_BRANCH at $sha."
          elif [ "$branch_status" -eq 2 ] && [ -f publication/state.json ]; then
            cp publication/state.json "$state_file"
            echo "Migrated legacy publication/state.json; the next successful run creates $PUBLICATION_STATE_BRANCH."
          elif [ "$branch_status" -eq 2 ]; then
            echo "No $PUBLICATION_STATE_BRANCH branch yet; this run publishes from scratch."
          else
            echo "::error::Could not query $PUBLICATION_STATE_BRANCH (git ls-remote exited $branch_status). Refusing to treat a read failure as a first run."
            exit 1
          fi

      - name: Restore Riebeckite build state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            .riebeckite/cache
            .riebeckite/build/content-state.json
            .riebeckite/ssg-output-cache.json
            .riebeckite/ssg-output-cache.entries
            .riebeckite/ssg-output-cache.fast-path.json
          key: riebeckite-build-v2-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('riebeckite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            riebeckite-build-v2-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('riebeckite.config.ts') }}-
            riebeckite-build-v2-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-

      - name: Report restored Riebeckite cache
        shell: bash
        run: |
          if [ -d .riebeckite ]; then
            echo "Restored Riebeckite cache: $(du -sb .riebeckite | cut -f1) bytes"
          else
            echo "Restored Riebeckite cache: 0 bytes (cold build)"
          fi

      - name: Validate configuration and plugins
        run: npm exec riebeckite check

      - name: Build the site
        run: npm exec riebeckite build

      - name: Report Riebeckite cache to save
        shell: bash
        run: |
          echo "Riebeckite cache to save: $(du -sb .riebeckite | cut -f1) bytes"

      - name: Validate the built artifact
        run: npm exec riebeckite publish validate

      - name: Publication gate
        run: npm exec riebeckite publish gate --provider cloudflare-workers

      - name: Deploy the built assets
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Record publication state
        run: npm exec riebeckite publish record --provider cloudflare-workers --trigger ci

      - name: Persist publication state
        shell: bash
        env:
          PUBLICATION_STATE_SHA: ${{ steps.publication-state.outputs.sha }}
        run: |
          set -euo pipefail
          state_file="$RIEBECKITE_PUBLICATION_STATE"
          if [ ! -f "$state_file" ]; then
            echo "::error::Deployment succeeded but publish record wrote no state to $state_file. Rerun the workflow to recover."
            exit 1
          fi

          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::The source branch advanced during this run. The deployed revision is no longer current, so its publication state was not saved. Rerun against the current revision."
            exit 1
          fi

          branch_status=0
          git ls-remote --exit-code --heads origin "$PUBLICATION_STATE_BRANCH" > /dev/null 2>&1 || branch_status=$?
          case "$branch_status" in
            0)
              git fetch --depth=1 origin "$PUBLICATION_STATE_BRANCH"
              remote_sha="$(git rev-parse FETCH_HEAD)"
              ;;
            2)
              remote_sha=""
              ;;
            *)
              echo "::error::Could not query $PUBLICATION_STATE_BRANCH (git ls-remote exited $branch_status). The site was deployed; rerun to record its state."
              exit 1
              ;;
          esac

          if [ "$remote_sha" != "${PUBLICATION_STATE_SHA:-}" ]; then
            echo "::error::The $PUBLICATION_STATE_BRANCH branch moved during this run (expected '${PUBLICATION_STATE_SHA:-<none>}', found '${remote_sha:-<none>}'). Refusing to overwrite newer state. The site was deployed; rerun to record the current state."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob="$(git hash-object -w "$state_file")"
          tree="$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)"
          if [ -n "$remote_sha" ]; then
            commit="$(git commit-tree "$tree" -p "$remote_sha" -m "公開状態を更新")"
          else
            commit="$(git commit-tree "$tree" -m "公開状態を更新")"
          fi
          git push origin "$commit:refs/heads/$PUBLICATION_STATE_BRANCH"
          echo "Saved publication state to $PUBLICATION_STATE_BRANCH at $commit."

