packages:
  - 'packages/*'
  - 'packages/integrations/*'
  - 'packages/plugins/*'
  - 'packages/themes/*'
  - 'apps/*'
  # The external-site fixture is intentionally NOT a workspace package. It is
  # copied to a temporary directory and installed there as a standalone npm
  # project, so pnpm must never treat it as part of this workspace.
  - '!tests/**'
  - '!tests/external-site/**'
allowBuilds:
  esbuild: true
  puppeteer: true
  sharp: true
  workerd: true
patchedDependencies:
  '@hono/vite-ssg@0.3.3': patches/@hono__vite-ssg@0.3.3.patch
