name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

concurrency:
  group: riebeckite-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the site repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Riebeckite build state
        uses: actions/cache@v4
        with:
          path: |
            .riebeckite/cache
            .riebeckite/build/content-state.json
          key: riebeckite-build-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            riebeckite-build-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            riebeckite-content-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Validate configuration and plugins
        run: npm exec riebeckite check

      - name: Build the site
        run: npm exec riebeckite build

      - name: Deploy the built assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
