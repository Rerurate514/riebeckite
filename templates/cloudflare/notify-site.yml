name: Notify Riebeckite site

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch configuration
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not configured. Add a token that can dispatch to OWNER/SITE_REPOSITORY."
            exit 1
          fi

      - name: Notify the site repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SITE_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "OWNER",
              repo: "SITE_REPOSITORY",
              event_type: "content-updated",
            });
